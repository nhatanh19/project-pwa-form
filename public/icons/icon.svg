  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Subtle Grid Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4" stroke-dasharray="12 12" />
  
  <!-- Vehicle & Eco Icon Symbol -->
  <!-- Car Silhouette / Bus -->
  <g transform="translate(106, 120)" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
